{% extends "base.html" %}
{% block title %}New Business - Citation Builder{% endblock %}
{% block content %}
<h1>Create Business</h1>

<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Business Name *</label>
            <input type="text" name="business_name" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="(555) 123-4567">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email">
            </div>
        </div>
        <div class="form-group">
            <label>Address</label>
            <input type="text" name="address" placeholder="123 Main St">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>City</label>
                <input type="text" name="city">
            </div>
            <div class="form-group">
                <label>Province</label>
                <input type="text" name="province" placeholder="e.g. Ontario, BC">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Postal Code</label>
                <input type="text" name="postal_code" placeholder="A1A 1A1">
            </div>
            <div class="form-group">
                <label>Website</label>
                <input type="url" name="website" placeholder="https://">
            </div>
        </div>
        <div class="form-group">
            <label>Categories (comma-separated)</label>
            <input type="text" name="categories" placeholder="Restaurant, Italian, Pizza">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4"></textarea>
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status">
                <option value="draft">Draft</option>
                <option value="active">Active</option>
                <option value="paused">Paused</option>
            </select>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Create Business</button>
            <a href="{{ url_for('business.list_businesses') }}" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
