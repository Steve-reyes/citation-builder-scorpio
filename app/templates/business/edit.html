{% extends "base.html" %}
{% block title %}Edit {{ business.business_name }} - Citation Builder{% endblock %}
{% block content %}
<h1>Edit Business: {{ business.business_name }}</h1>

<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Business Name *</label>
            <input type="text" name="business_name" value="{{ business.business_name }}" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ business.phone or '' }}">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ business.email or '' }}">
            </div>
        </div>
        <div class="form-group">
            <label>Address</label>
            <input type="text" name="address" value="{{ business.address or '' }}">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>City</label>
                <input type="text" name="city" value="{{ business.city or '' }}">
            </div>
            <div class="form-group">
                <label>Province</label>
                <input type="text" name="province" value="{{ business.province or '' }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Postal Code</label>
                <input type="text" name="postal_code" value="{{ business.postal_code or '' }}">
            </div>
            <div class="form-group">
                <label>Website</label>
                <input type="url" name="website" value="{{ business.website or '' }}">
            </div>
        </div>
        <div class="form-group">
            <label>Categories (comma-separated)</label>
            <input type="text" name="categories" value="{{ business.categories or '' }}">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4">{{ business.description or '' }}</textarea>
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status">
                <option value="draft" {% if business.status == 'draft' %}selected{% endif %}>Draft</option>
                <option value="active" {% if business.status == 'active' %}selected{% endif %}>Active</option>
                <option value="paused" {% if business.status == 'paused' %}selected{% endif %}>Paused</option>
            </select>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Update Business</button>
            <a href="{{ url_for('business.view_business', id=business.id) }}" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
